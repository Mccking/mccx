name: mccx-release

# Daily watch on the upstream engine data, plus manual runs.
on:
  schedule:
    - cron: '0 20 * * *'   # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

env:
  MIHOMO_VER: v1.19.33

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not android-actions/setup-android: it still asks for the retired "tools"
      # package and dies with "Failed to find package 'tools'".
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0"
          ls "$SDK/build-tools/35.0.0/aapt2" "$SDK/platforms/android-34/android.jar"

      - name: Restore signing key
        env:
          KS_BASE64: ${{ secrets.MCCX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_BASE64" ]; then
            echo "::error::缺少 MCCX_KEYSTORE_BASE64，签名必须与已装版本一致"
            exit 1
          fi
          printf '%s' "$KS_BASE64" | base64 -d > keystore.jks

      # The upstream Go engine is shipped as lib/engine.aar (see the service),
      # so the legacy mihomo subprocess and its launcher are no longer built.
      - name: Sync upstream constants
        id: sync
        shell: pwsh
        run: |
          ./tools/sync_upstream.ps1
          $changed = (git status --porcelain src/com/xehn/warp/UpstreamDefaults.java).Length -gt 0
          Write-Host "upstream drift: $changed"
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($changed) {
            # Upstream does not always expose a commit (codeload zip has no .git),
            # so a missing match must not fail the job.
            $m = Select-String -Path src/com/xehn/warp/UpstreamDefaults.java -Pattern 'UPSTREAM_COMMIT = "([0-9a-f]+)"'
            if ($m) { "commit=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT }
          }

      - name: Resolve version
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # GitHub expressions have no arithmetic; compute here and export.
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          BASE_VERSION="$(tr -d ' \t\r\n' < version.txt)"
          echo "VERSION_NAME=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${GITHUB_RUN_NUMBER}/mccx-${BASE_VERSION}.${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "NOTES=upstream ${{ steps.sync.outputs.commit }}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          KS_PASS: ${{ secrets.MCCX_KEYSTORE_PASS }}
        run: bash tools/build.sh

      - name: Publish release
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MccX ${{ github.run_number }}
          body: |
            Auto-built from upstream `${{ steps.sync.outputs.commit || 'unchanged' }}`.
            versionCode is 1000 + the run number.
          files: |
            dist/*.apk
            dist/update.json






